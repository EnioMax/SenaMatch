name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamlit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: streamlit/requirements.txt
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q
